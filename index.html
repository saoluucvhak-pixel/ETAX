<!doctype html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>eTax Manager HAK Group</title>
  <meta name="description" content="Quản lý hóa đơn điện tử và làm việc với cổng Thuế điện tử.">
  <meta name="theme-color" content="#0f2740">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/views.css">
  <script>
    // Đặt theme sớm để không bị nháy trắng khi tải trang.
    (function () {
      try {
        var t = localStorage.getItem('etax.theme') || 'auto';
        var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) { /* bỏ qua */ }
    })();
  </script>
</head>
<body>
  <div id="app" class="boot">
    <noscript>eTax Manager cần bật JavaScript để chạy.</noscript>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
