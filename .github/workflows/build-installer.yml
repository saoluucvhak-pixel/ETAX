name: Build Installer (Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build Windows NSIS Installer
        run: npx electron-builder --win --x64 --publish never
      - name: Package Browser Extension ZIP
        shell: pwsh
        run: Compress-Archive -Path extension -DestinationPath dist/eTax-extension.zip -Force
      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eTax-Manager-Windows-Installer
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/eTax-extension.zip
          if-no-files-found: error
      - name: Attach to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/eTax-extension.zip
